name: Aprovacions i publicació

on:
  schedule:
    - cron: "*/5 * * * *"    # cada 5 minuts: llegeix els ✅/❌ i publica si toca
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre l'estat més recent, no el del moment en què es va llançar

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Llegeix les respostes de Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/telegram_poll.py

      - name: Publica si és hora
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: python scripts/publish.py

      - name: Desa els canvis al repositori
        if: always()
        run: |
          git config user.name "mustang-bot"
          git config user.email "mustang-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Estat del bot"
          git pull --rebase && git push
