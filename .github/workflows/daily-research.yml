name: Recerca diària de candidats

on:
  schedule:
    - cron: "17 4 * * *"    # cada nit a les 4:17 UTC: 5:17 a Barcelona (6:17 a l'estiu), 23:17 a Nova York.
                            # Marge per als retards de GitHub perquè els candidats hi siguin abans de les 8.
  workflow_dispatch:         # botó "Run workflow" per llançar-lo a mà
    inputs:
      candidates:
        description: "Quants candidats enviar (buit = el de la configuració)"
        required: false
        default: ""
      all_hashtags:
        description: "Buscar a tots els hashtags (no només els del dia)"
        type: boolean
        default: false
      results_per_hashtag:
        description: "Resultats per hashtag (buit = configuració)"
        required: false
        default: ""
      max_age_days:
        description: "Antiguitat màxima en dies (buit = configuració)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre l'estat més recent, no el del moment en què es va llançar

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pillow

      - name: ffmpeg (pantalla final dels reels)
        run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)

      - name: Llegeix les respostes pendents de Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/telegram_poll.py || true

      - name: Candidats del banc (si n'hi ha prou, no es gasta Apify)
        if: inputs.candidates == '' && inputs.all_hashtags != true
        run: |
          DAY=$(date -u +%Y-%m-%d)
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          cd scripts && python bank_to_candidates.py --day $DAY

      - name: Descarrega posts dels hashtags del dia
        id: fetch
        if: env.USE_BANK != 'true'
        continue-on-error: true   # si s'acaba el crèdit d'Apify, es fan servir reels del banc
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ALL_HASHTAGS: ${{ inputs.all_hashtags }}
          RESULTS_PER_HASHTAG: ${{ inputs.results_per_hashtag }}
        run: python scripts/fetch_hashtags.py --output /tmp/raw.json

      - name: Sense crèdit d'Apify → reels del banc
        if: env.USE_BANK != 'true' && steps.fetch.outcome == 'failure'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          DAY=$(date -u +%Y-%m-%d)
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          cd scripts
          python bank_to_candidates.py --day $DAY --force --count 4
          python - <<'PY'
          import os, requests
          from common import Telegram, chat_id
          end = "?"
          try:
              d = requests.get("https://api.apify.com/v2/users/me/limits", params={"token": os.environ["APIFY_TOKEN"]},
                               timeout=60).json()["data"]
              end = (d.get("monthlyUsageCycle") or {}).get("endAt", "?")[:10]
              print("Apify:", d["current"].get("monthlyUsageUsd"), "de", d["limits"].get("maxMonthlyUsageUsd"), "USD; cicle fins", end)
          except Exception as e:
              print("No s'ha pogut llegir el crèdit d'Apify:", e)
          if os.environ.get("TELEGRAM_BOT_TOKEN") and chat_id():
              Telegram(os.environ["TELEGRAM_BOT_TOKEN"]).call("sendMessage", chat_id=chat_id(), disable_notification=True,
                  text=f"⚠️ La cerca d'avui no ha funcionat (probablement s'ha acabat el crèdit gratuït d'Apify, que es renova el {end}). "
                       "T'envio 4 reels del banc perquè no quedi cap franja buida.")
          PY

      - name: Puntua i tria candidats
        if: env.USE_BANK != 'true' && steps.fetch.outcome == 'success'
        env:
          CANDIDATES: ${{ inputs.candidates }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days }}
        run: |
          DAY=$(date -u +%Y-%m-%d)
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          python scripts/select_candidates.py \
            --input /tmp/raw.json \
            --output data/candidates/$DAY.json \
            --media-dir media/$DAY

      - name: Envia els candidats per Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          DAY=${DAY:-$(date -u +%Y-%m-%d)}
          python scripts/telegram_send.py --candidates data/candidates/$DAY.json

      - name: Desa els canvis al repositori
        run: |
          git config user.name "mustang-bot"
          git config user.email "mustang-bot@users.noreply.github.com"
          git add data media
          git diff --cached --quiet && exit 0
          git commit -m "Candidats $DAY"
          git pull --rebase && git push
