name: Recerca diària de candidats

on:
  schedule:
    - cron: "17 11 * * *"   # cada dia cap a les 6:17 de Nova York (11:17 UTC)
  workflow_dispatch: {}      # botó "Run workflow" per llançar-lo a mà

permissions:
  contents: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Descarrega posts dels hashtags del dia
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/fetch_hashtags.py --output /tmp/raw.json

      - name: Puntua i tria candidats
        run: |
          DAY=$(date -u +%Y-%m-%d)
          python scripts/select_candidates.py \
            --input /tmp/raw.json \
            --output data/candidates/$DAY.json \
            --media-dir media/$DAY

      - name: Desa els candidats al repositori
        run: |
          git config user.name "mustang-bot"
          git config user.email "mustang-bot@users.noreply.github.com"
          git add data/candidates media
          git diff --cached --quiet || git commit -m "Candidats $(date -u +%Y-%m-%d)"
          git push
