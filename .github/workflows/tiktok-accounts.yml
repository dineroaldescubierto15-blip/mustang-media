name: Comptes de TikTok a Zernio

# Llista els comptes connectats a Zernio per saber l'ID que va a tiktok.account_id (config/sources.json).
on:
  workflow_dispatch:

jobs:
  accounts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: python scripts/tiktok.py accounts
