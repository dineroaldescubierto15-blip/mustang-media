name: Banc de reels

on:
  workflow_dispatch:
    inputs:
      study:
        description: "Carpeta de l'estudi (analysis/AAAA-MM-DD)"
        default: "analysis/2026-11-26"
      size:
        description: "Quants reels afegir"
        default: "40"

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  bank:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: cd scripts && python build_bank.py --study ../${{ inputs.study }} --size ${{ inputs.size }}
      - name: Desa el banc
        if: always()
        run: |
          git config user.name "mustang-bot"
          git config user.email "mustang-bot@users.noreply.github.com"
          git add data media
          git diff --cached --quiet && exit 0
          git commit -m "Banc de reels"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 3; done
