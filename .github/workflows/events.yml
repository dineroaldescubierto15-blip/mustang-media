name: Esdeveniments de Make

on:
  repository_dispatch:
    types: [telegram, publish]

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  event:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Clic o ordre de Telegram
        if: github.event.action == 'telegram'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/telegram_event.py

      - name: Publica si és hora
        if: github.event.action == 'publish'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          FORCE_PUBLISH: ${{ github.event.client_payload.force }}
        run: python scripts/publish.py

      - name: Desa els canvis al repositori
        if: always()
        run: |
          git config user.name "mustang-bot"
          git config user.email "mustang-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Esdeveniment: ${{ github.event.action }}"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 3; done
